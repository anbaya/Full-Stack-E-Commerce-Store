on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    name: "Build and Test"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        
      - name: "Build Docker images"
        run: docker compose build
        
      - name: "Run Lint (Back-end)"
        run: docker compose run --rm back-end npm run lint
        
      - name: "Run Tests (Back-end)"
        run: docker compose run --rm back-end npm test