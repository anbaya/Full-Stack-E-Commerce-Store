<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DashBoard</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" href="../../general-images/icon.png" type="image/png">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="dashboard.js" defer></script>
</head>
<body>
        <nav>
            <div class="nav-container">
                <h2 class="logo">D.Seller</h2>
                <div class="menu">
                    <a href="home.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a href="product.html">Product</a>
                </div>
            </div>
        </nav>
    <main>
        <section id="dashboard" aria-labelledby="admin-dashboard-heading">
            <div id="dashList">
                <ul>
                    <li><a href="./product.html" id="manageProducts">Manage Products</a></li>
                    <li><a href="orderManager.html">Manage Orders</a></li>
                    <li><a href="usersDashboard.html">Manage Users</a></li>
                </ul>
            </div>
            <section class="summary-container" id="summaries" aria-labelledby="dashboard-summaries-heading">
                <div class="summary-header">
                    <h1 id="admin-dashboard-heading">Welcome to Admin Dashboard</h1>
                </div>
                <div class="summaries-wrapper">
                    <div id="productsSummary" class="summary-box">
                        <h3 class="sh">Products Summary</h3>
                        <p class="sp" id="totalProducts">Total Products: 150</p>
                    </div>
                    <div id="ordersSummary" class="summary-box">
                        <h3 class="sh">Orders Summary</h3>
                        <p class="sp" id="totalOrders">Total Orders: 75</p>
                        <p class="sp" id="totalSales">Total Sales: $12,500</p>
                    </div>
                    <div id="usersSummary" class="summary-box">
                        <h3 class="sh">Users Summary</h3>
                        <p class="sp" id="totalUsers">Total Users: 200</p>
                    </div>
                    <div id="messagesSummary" class="summary-box">
                        <h3 class="sh">Messages Summary</h3>
                        <p class="sp" id="totalMessages">Total Messages: 3</p>
                    </div>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
