<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="ProductTitle">Product Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Product.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Playpen+Sans+Arabic:wght@100..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="icon" href="general-images/icon.png" type="image/png">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="product.Page.js" defer></script>
</head>
<body>
    <main>
        <nav>
            <div class="nav-container">
                <h2 class="logo">D.Seller</h2>
                <div class="menu">
                    <a href="cart.html">Cart</a>
                    <a href="home.html">Home</a>
                    <a href="product.html">Products</a>
                    <a href="account.html">Account</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </nav>
        <section id="ProductSection">
            <div id="imagesContainer">
                <img id="mainImage" src="" alt="Main Image">
                <div id="previewImages">
                    <img class="preview" id="Image1" src="" alt="">
                    <img class="preview" id="Image2" src="" alt="">
                    <img class="preview" id="Image3" src="" alt="">
                    <img class="preview" id="Image4" src="" alt="">
                </div>
            </div>
            <div id="productDetailsContainer">
                <h1 id="productTitle">Product Title</h1>
                <p id="productDescription">Product Description</p>
                <span id="productPrice">$0.00</span>
                <h4 id="stock">In Stock</h4>
                quantity: <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
                <button id="addToCartButton" class="button">Add to Cart</button>
            </div>
        </section>
        <section id="oderProductsSection">
            <h1 class="before-gallery section-title">Have a look at other Products</h1>
            <div class="gallery">
                <div class="flex-cards" id="product-cards"></div>
            </div>
        </section>
    </main>
    <footer class="bottom-bar">
        <p>&copy; 2025 MyWebsite. All rights reserved.</p>
    </footer>
</body>
</html>
